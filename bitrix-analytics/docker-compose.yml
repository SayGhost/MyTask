services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # только с самого сервера; наружу БД не открываем
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  etl:
    build: ./etl
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      RECONCILE_HOUR: ${RECONCILE_HOUR:-3}
      BITRIX_MIN_INTERVAL_SEC: ${BITRIX_MIN_INTERVAL_SEC:-0.5}

volumes:
  pgdata:
