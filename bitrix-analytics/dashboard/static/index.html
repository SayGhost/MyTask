<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитика</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app" id="app">
  <nav class="rail" aria-label="Дашборды">
    <div class="rail-logo" id="logo" aria-hidden="true"></div>
    <div class="rail-items" id="rail"></div>
  </nav>
  <div class="panel main-panel">
    <header class="top">
      <div class="brand">
        <h1 id="title">Аналитика</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="top-actions">
        <button class="btn icon-btn" id="reload" type="button" title="Перечитать файл выгрузки"></button>
      </div>
    </header>
    <main id="view"></main>
    <p class="meta" id="file-meta"></p>
  </div>
</div>
<div class="switcher" id="switcher" role="group" aria-label="Оформление">
  <i class="sw-ind" aria-hidden="true"></i>
  <button type="button" data-skin="glass">Тёмная</button>
  <button type="button" data-skin="light">Светлая</button>
</div>
<div id="tip" role="tooltip"></div>
<script src="/metrics.js"></script>
<script src="/ui.js"></script>
<script src="/filters.js"></script>
<script src="/marketing.js"></script>
<script src="/overview.js"></script>
<script src="/app.js"></script>
</body>
</html>
